<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SyncFlow</title>
</head>

<body>

    <div id="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="logo">
                SyncFlow
            </div>

        </header>


        <!-- =========================
             APPLICATION LAYOUT
        ========================== -->

        <div class="app-layout">


            <!-- =========================
                 SIDEBAR
            ========================== -->

            <aside class="sidebar">

                <div class="sidebar-header">

                    <h2>Projects</h2>

                    <button
                        id="new-project-btn"
                        class="new-project-btn"
                        type="button"
                    >
                        + New
                    </button>

                </div>


                <!-- Projects will be dynamically
                     inserted here -->

                <div
                    id="project-list"
                    class="project-list"
                >
                </div>

            </aside>



            <!-- =========================
                 MAIN CONTENT
            ========================== -->

            <main class="main-content">


                <!-- =========================
                     PROJECT HEADER
                ========================== -->

                <section class="project-header">

                    <h1 id="current-project-title">
                        Default
                    </h1>

                    <button
                        id="delete-project-btn"
                        class="delete-project-btn hidden"
                        type="button"
                    >
                        Delete Project
                    </button>
                                            
                    <button
                        id="add-task-btn"
                        class="add-task-btn"
                        type="button"
                    >
                        + Add Task
                    </button>

                </section>



                <!-- =========================
                     TODO CONTENT
                ========================== -->

                <section class="todo-content">


                    <!-- =========================
                         TODO LIST
                    ========================== -->

                    <div class="todo-list-panel">

                        <div class="panel-header">

                            <h2>Your Tasks</h2>

                        </div>


                        <!-- Todo items will be
                             dynamically inserted here -->

                        <div
                            id="todo-list"
                            class="todo-list"
                        >
                        </div>

                    </div>



                    <!-- =========================
                         TODO DETAILS
                    ========================== -->

                    <div class="todo-details-panel">

                        <div
                            id="empty-details"
                            class="empty-details"
                        >
                            <h2>Select a task</h2>

                            <p>
                                Select a task from the list
                                to view its details.
                            </p>
                        </div>


                        <!--

                        This is where the selected
                        Todo details will appear.

                        JavaScript will eventually
                        dynamically render:

                        - Title
                        - Description
                        - Due date
                        - Priority
                        - Notes
                        - Subtasks

                        -->

                        <div
                            id="todo-details"
                            class="todo-details hidden"
                        >

                            <h2 id="detail-title">
                                Todo Title
                            </h2>


                            <div class="detail-section">

                                <h3>Description</h3>

                                <p id="detail-description">
                                    Todo description
                                </p>

                            </div>


                            <div class="detail-section">

                                <h3>Due Date</h3>

                                <p id="detail-due-date">
                                    2026-08-01
                                </p>

                            </div>


                            <div class="detail-section">

                                <h3>Priority</h3>

                                <p
                                    id="detail-priority"
                                    class="priority-low"
                                >
                                    Low
                                </p>

                            </div>


                            <div class="detail-section">

                                <h3>Notes</h3>

                                <p id="detail-notes">
                                    No notes
                                </p>

                            </div>


                            <div class="detail-section">

                                <h3>Subtasks</h3>

                                <div
                                    id="subtask-list"
                                    class="subtask-list"
                                >

                                    <!-- Subtasks will
                                         appear here -->

                                </div>

                                <button
                                    id="add-subtask-btn"
                                    class="secondary-btn"
                                    type="button"
                                >
                                    + Add Sub-Task
                                </button>

                            </div>

                        </div>

                    </div>

                </section>

            </main>

        </div>


        <!-- =================================
             DIALOG AREA
             
             YOU WILL DESIGN THESE
             ================================= -->

        <!--

        ADD PROJECT DIALOG
        ------------------
        -->

        <dialog id = "project-dialog" class = "project-dialog">

            <form class = "project-dialog-form subtask-dialog-form">
                <h2 class = "new-project-heading">Create New Project</h2>

                <label for = "project-name">Project Name</label>
                <input type = "text" id = "project-name" class = "form-text-field" placeholder= "eg, Gym Project">

                <div class = "form-btns">
                    <button type = "button" class = "form-cancel-btn"> Cancel </button>
                    <button type = "submit" class = "form-create-btn"> Create Project </button>
                </div>
            </form>

        </dialog>

        <!--

        ADD TODO DIALOG
        ---------------

        -->
        
        <dialog id = "add-task-dialog" class = "task-dialog-box">
            <form class = "task-dialog-form edit-dialog-form">
                <h2 class = "new-project-heading"> Create New Task </h2>
                
                <label for = "task-name">Task Name</label>
                <input type = "text" id = "task-name" class = "form-text-field" placeholder= "eg, DLD Assignment">

                <label for = "task-description">Task Description</label>
               <textarea
                        id="task-description"
                        class="form-text-area"
                        placeholder="Overview of the Task"
                ></textarea>

                <div class = "date-and-priority">
                <label for = "due-date">Due Date</label>
                <input type = "date" id = "due-date" class = "form-due-date">

                <label for = "form-priority">Priority</label>
                 <select
                    id="form-priority"
                    class="form-due-date"
                >
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                </div>

                <label for = "notes">Notes</label>
                <textarea
                    id="notes"
                    class="form-notes"
                    placeholder="Additional Details or Links..."
                ></textarea>

                <div class = "form-btns">
                    <button type = "button" class = "form-cancel-btn"> Cancel </button>
                    <button type = "submit" class = "form-create-btn"> Submit Task </button>
                </div>
                
            </form>

        </dialog>

        <!--
        EDIT TODO DIALOG
        ----------------
        -->

        <dialog id = "edit-task-dialog" class = "task-dialog-box">
            <form class = "task-dialog-form edit-dialog-form">
                <h2 class = "new-project-heading"> Edit Task </h2>
                
                <label for = "edit-task-name">Task Name</label>
                <input type = "text" id = "edit-task-name" class = "form-text-field" placeholder= "eg, DLD Assignment">

                <label for = "edit-task-description">Task Description</label>
                <textarea
                    id="edit-task-description"
                    class="form-text-area"
                    placeholder="Overview of the Task"
                ></textarea>

                <div class = "date-and-priority">
                <label for = "edit-due-date">Due Date</label>
                <input type = "date" id = "edit-due-date" class = "form-due-date">

                <label for = "edit-form-priority">Priority</label>
                <select
                    id="edit-form-priority"
                    class="form-due-date"
                >
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                </div>

                <label for = "edit-notes">Notes</label>
                 <textarea
                    id="edit-notes"
                    class="form-notes"
                    placeholder="Additional Details or Links..."
                ></textarea>

                <div class = "form-btns">
                    <button type = "button" class = "form-cancel-btn"> Cancel </button>
                    <button type = "submit" class = "form-create-btn"> Save Changes </button>
                </div>
                
            </form>

        </dialog>


        <dialog id = "subtask-dialog" class = "project-dialog">

            <form class = "project-dialog-form subtask-dialog-form">
                <h2 class = "new-project-heading">Add a SubTask</h2>

                <label for = "subtask-name">SubTask Name</label>
                <input type = "text" id = "subtask-name" placeholder= "eg, Gym Project" class = "form-text-field">

               <div class = "form-btns">
                    <button type = "button" class = "form-cancel-btn"> Cancel </button>
                    <button type = "submit" class = "form-create-btn"> Create SubTask </button>
                </div>
            </form>

        </dialog>


    </div>

</body>
</html>
